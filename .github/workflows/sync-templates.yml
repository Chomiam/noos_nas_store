name: Synchronisation, Audit & Publication du Store Noos NAS

on:
  schedule:
    # Exécution hebdomadaire chaque lundi à 4h00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-audit:
    name: Importer, Valider, Filtrer & Publier les Applications
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install pyyaml requests

      - name: ⚡ Étape 1 : Ingestion et normalisation des templates Portainer
        run: |
          python3 scripts/import_portainer.py

      - name: 🛡️ Étape 2 : Audit qualité, vérification Compose Spec & élimination des images obsolètes
        run: |
          python3 scripts/validate_and_filter.py

      - name: 🧪 Étape 3 : Contrôle d'intégrité final
        run: |
          echo "🔍 Vérification de store.json..."
          python3 -c "import json; d = json.load(open('store.json')); assert d['total_apps'] > 100; print(f'✓ {d[\"total_apps\"]} applications certifiées prêtes dans store.json')"

      - name: 🚀 Étape 4 : Commit et Publication sur GitHub
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add store.json apps/
          if git diff --staged --quiet; then
            echo "ℹ️ Aucune modification détectée. Catalogue déjà à jour et conforme."
          else
            git commit -m "chore(store): synchronisation, filtrage qualité et publication automatique ($(date +'%Y-%m-%d'))"
            git push origin main
          fi
