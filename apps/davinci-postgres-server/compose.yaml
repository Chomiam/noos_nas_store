services:
  davinci-postgres-server:
    container_name: davinci-postgres-server
    image: postgres:13
    restart: unless-stopped
    ports:
    - 5432:5432/tcp
    volumes:
    - ./data/DavinciServer/:/var/lib/postgresql/data
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=America/New_York
    - UMASK=002
    - POSTGRES_DB=database
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=DaVinci
