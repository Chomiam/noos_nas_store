services:
  sematext-agent:
    container_name: sematext-agent
    image: sematext/sematext-agent-docker:latest
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - LOGSENE_TOKEN=
    - SPM_TOKEN=
