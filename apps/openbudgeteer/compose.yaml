networks:
  app-global:
    external: true
  mysql-internal: null
services:
  openbudgeteer:
    image: axelander/openbudgeteer
    container_name: openbudgeteer
    ports:
    - 8081:80
    environment:
    - Connection:Server=openbudgeteer-mysql
    - Connection:Port=3306
    - Connection:Database=openbudgeteer
    - Connection:User=openbudgeteer
    - Connection:Password=openbudgeteer
    - AppSettings:Culture=en-US
    depends_on:
    - mysql
    networks:
    - app-global
    - mysql-internal
    restart: unless-stopped
  mysql:
    image: mysql
    container_name: openbudgeteer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: myRootPassword
    volumes:
    - ./data/openbudgeteer/data:/var/lib/mysql
    networks:
    - mysql-internal
    restart: unless-stopped
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: openbudgeteer-phpmyadmin
    links:
    - mysql:db
    ports:
    - 8080:80
    networks:
    - app-global
    - mysql-internal
    restart: unless-stopped
volumes:
  data: null
