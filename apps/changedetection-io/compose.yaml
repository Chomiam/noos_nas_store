services:
  changedetection-io:
    container_name: changedetection-io
    image: linuxserver/changedetection.io:latest
    restart: unless-stopped
    ports:
    - 5000:5000/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - BASE_URL=
    - PLAYWRIGHT_DRIVER_URL=
