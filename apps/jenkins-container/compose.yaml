services:
  jenkins-container:
    container_name: jenkins-container
    image: jenkins/jenkins:lts
    restart: unless-stopped
    ports:
    - 8080/tcp
    - 50000/tcp
    volumes:
    - ./data/var_jenkins_home:/var/jenkins_home
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - JENKINS_OPTS=
