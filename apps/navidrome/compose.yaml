services:
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    ports:
    - 4533:4533
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_BASEURL: ''
    volumes:
    - ./data/navidrome:/data
    - ./data/folder:/music:ro
    restart: unless-stopped
