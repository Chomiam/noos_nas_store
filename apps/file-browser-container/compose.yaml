services:
  file-browser-container:
    container_name: file-browser-container
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    ports:
    - 80/tcp
    volumes:
    - ./data/data:/data
    - ./data/srv:/srv
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
