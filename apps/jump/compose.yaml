services:
  web:
    image: daledavies/jump
    ports:
    - 9123:8080
    volumes:
    - ./data/jumper/backgrounds:/backgrounds
    - ./data/jumper/favicon:/favicon
    - ./data/jumper/search:/search
    - ./data/jumper/sites:/sites
    environment:
      SITENAME: Custom site name
      OWMAPIKEY: 0a1b2c3d4e5f6a7b8c9d0a1b
      LATLONG: 51.509865,-0.118092
    restart: unless-stopped
