services:
  cryptpad:
    image: cryptpad/cryptpad:version-2026.5.1
    hostname: cryptpad
    restart: unless-stopped
    environment:
    - CPAD_MAIN_DOMAIN=${CPAD_MAIN_DOMAIN}
    - CPAD_SANDBOX_DOMAIN=${CPAD_SANDBOX_DOMAIN}
    - CPAD_CONF=/cryptpad/config/config.js
    volumes:
    - ./data/cryptpad-blob:/cryptpad/blob
    - ./data/cryptpad-block:/cryptpad/block
    - ./data/cryptpad-customize:/cryptpad/customize
    - ./data/cryptpad-data:/cryptpad/data
    - ./data/cryptpad-datastore:/cryptpad/datastore
    ports:
    - 3000:3000
    - 3003:3003
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
volumes:
  cryptpad-blob: null
  cryptpad-block: null
  cryptpad-customize: null
  cryptpad-data: null
  cryptpad-datastore: null
