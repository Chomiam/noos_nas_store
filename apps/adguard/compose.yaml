# =========================================================================
# 🐳 STEvE_OS NAS Edition — Configuration Docker Compose
# Application  : AdGuard Home (adguard)
# Port WebUI   : 3000 (Initialisation) / 80 (Administration)
# Port DNS     : 53 (TCP/UDP)
# Données hôte : ./data/work et ./data/conf
# =========================================================================

version: "3.8"

services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      # Serveur DNS principal (TCP et UDP indispensables)
      - "53:53/tcp"
      - "53:53/udp"
      # Assistant d'installation Web initial
      - "3000:3000/tcp"
      # Interface Web d'administration finale
      - "80:80/tcp"
      # DNS over TLS (DoT chiffré)
      - "853:853/tcp"
    volumes:
      - ./data/work:/opt/adguardhome/work
      - ./data/conf:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=100
      - UMASK=002
