services:
  adguard:
    container_name: adguard
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 67:67/udp
    - 68:68/tcp
    - 68:68/udp
    - 80:80/tcp
    - 443:443/tcp
    - 853:853/tcp
    - 3000:3000/tcp
    volumes:
    - ./data/Workdir:/opt/adguardhome/work
    - ./data/Conf:/opt/adguardhome/conf
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - CONTEXT_PATH=adguard home
