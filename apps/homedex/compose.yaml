name: homedex
services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VERSION: 1
      POST: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
    - /run
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - discovery
  homedex:
    image: ghcr.io/harshshah0203/homedex:${HOMEDEX_VERSION:-0.2}
    restart: unless-stopped
    depends_on:
    - docker-socket-proxy
    ports:
    - ${HOMEDEX_BIND:-127.0.0.1}:${HOMEDEX_PORT:-7377}:7377
    environment:
      HOMEDEX_DATA_DIR: /data
      HOMEDEX_LISTEN: :7377
      HOMEDEX_ADMIN_PASSWORD: ${HOMEDEX_ADMIN_PASSWORD:-}
    volumes:
    - ./data/homedex-data:/data
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - app
    - discovery
networks:
  app:
    internal: false
  discovery:
    internal: true
volumes:
  homedex-data: null
