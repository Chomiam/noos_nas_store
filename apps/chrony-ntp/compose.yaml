services:
  chrony-ntp:
    container_name: chrony-ntp
    image: cturra/ntp:latest
    restart: unless-stopped
    ports:
    - 123:123/udp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - LOG_LEVEL=0
    - NTP_SERVERS=time.cloudflare.com
