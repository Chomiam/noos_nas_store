services:
  smokeping:
    container_name: smokeping
    image: linuxserver/smokeping:latest
    restart: unless-stopped
    ports:
    - 80:80/tcp
    volumes:
    - ./data/config:/config
    - ./data/data:/data
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - MASTER_URL=http://<master-host-ip>:80/smokeping/
    - SHARED_SECRET=password
    - CACHE_DIR=/tmp
