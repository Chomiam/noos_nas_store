services:
  magento-2:
    container_name: magento-2
    image: alankent/gsd:latest
    restart: unless-stopped
    ports:
    - 80/tcp
    - 3000/tcp
    - 3001/tcp
    volumes:
    - ./data/var_www_html:/var/www/html/
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
