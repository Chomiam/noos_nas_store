services:
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    ports:
    - 3552:3552
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./data/arcane-data:/app/data
    - ./data/arcane/projects:/app/data/projects
    environment:
    - APP_URL=http://localhost:3552
    - PUID=1000
    - PGID=1000
    - ENCRYPTION_KEY=ec5019c954f3bbbb13b7ee62123594908718ad0dcaac2908501436c26d0beb57
    - JWT_SECRET=08cfa58367486132fd2dcf14d06bad5347625def217588ec067486b7ad75613e
    restart: unless-stopped
volumes:
  arcane-data: null
