services:
  gateway:
    image: inductiveautomation/ignition:8.1.8
    ports:
    - 8088:8088
    - 8043:8043
    - 4446:4446/udp
    volumes:
    - ./data/gw-data:/usr/local/bin/ignition/data
    environment:
    - ACCEPT_IGNITION_EULA=${EULA}
    - GATEWAY_ADMIN_USERNAME=${adminuser}
    - GATEWAY_ADMIN_PASSWORD=${adminpass}
    - IGNITION_EDITION=${gwedition}
    - TZ=${TZ}
    command: '-n ${EDGE_ID} -m 1024 -- wrapper.java.initmemory=512 -Dignition.allowunsignedmodules=true

      '
    restart: unless-stopped
volumes:
  gw-data: null
