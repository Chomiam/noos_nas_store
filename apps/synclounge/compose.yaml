services:
  synclounge:
    container_name: synclounge
    image: linuxserver/synclounge:latest
    restart: unless-stopped
    ports:
    - 8088:8088/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - AUTH_LIST=plexuser1,plexuser2,email1,machineid1
