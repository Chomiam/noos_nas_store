services:
  calibre:
    container_name: calibre
    image: linuxserver/calibre:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    - 8181:8181/tcp
    - 8081:8081/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - PASSWORD=
    - CLI_ARGS=
