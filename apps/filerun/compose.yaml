version: '2'
services:
  db:
    image: mariadb:10.1
    environment:
      MYSQL_ROOT_PASSWORD: filerunroot
      MYSQL_USER: filerun
      MYSQL_PASSWORD: filerun
      MYSQL_DATABASE: filerun
    volumes:
    - ./data/apps/filerun/db:/var/lib/mysql
    networks:
    - filerun
    restart: unless-stopped
  app:
    restart: always
    image: afian/filerun
    ports:
    - '80'
    volumes:
    - ./data/tvshows:/user-files/depot/tvshows
    - ./data/movies:/user-files/depot/movies
    - ./data/music:/user-files/depot/music
    - ./data/photos:/user-files/depot/photos
    - ./data/ebooks:/user-files/depot/ebooks
    - ./data/documents:/user-files/depot/documents
    - ./data/downloads:/user-files/depot/downloads
    - ./data/software:/user-files/depot/software
    - ./data/blackhole:/user-files/depot/blackhole
    - ./data/processing:/user-files/depot/processing
    - ./data/apps/filerun/web:/var/www/html
    labels:
    - traefik.enable=true
    - traefik.http.services.filerun.loadbalancer.server.port=80
    - traefik.http.routers.filerun.rule=Host(`filerun.${DEPOT_DOMAIN_NAME}`)
    - traefik.http.routers.filerun.entrypoints=websecure
    - traefik.http.routers.filerun.tls.certresolver=mydnschallenge
    environment:
    - FR_DB_HOST=db
    - FR_DB_PORT=3306
    - FR_DB_NAME=filerun
    - FR_DB_USER=filerun
    - FR_DB_PASS=filerun
    - APACHE_RUN_USER=www-data
    - APACHE_RUN_USER_ID=15000
    - APACHE_RUN_GROUP=www-data
    - APACHE_RUN_GROUP_ID=15000
    depends_on:
    - db
    links:
    - db:db
    networks:
    - traefik
    - filerun
networks:
  traefik:
    external: true
  filerun: null
