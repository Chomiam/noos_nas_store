services:
  cashpilot:
    container_name: cashpilot
    image: drumsergio/cashpilot:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    volumes:
    - ./data/data:/data
    environment:
    - PUID=1000
    - PGID=100
    - TZ=UTC
    - UMASK=002
    - CASHPILOT_SECRET_KEY=
    - CASHPILOT_API_KEY=
