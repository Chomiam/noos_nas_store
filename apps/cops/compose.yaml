services:
  cops:
    container_name: cops
    image: linuxserver/cops:latest
    restart: unless-stopped
    ports:
    - 80:80/tcp
    - 443:443/tcp
    volumes:
    - ./data/config:/config
    - ./data/books:/books
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
