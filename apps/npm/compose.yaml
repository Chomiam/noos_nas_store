services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    - 81:81
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
    - ./data/npm/data:/data
    - ./data/npm/letsencrypt:/etc/letsencrypt
