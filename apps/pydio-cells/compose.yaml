services:
  pydio-cells:
    container_name: pydio-cells
    image: linuxserver/pydio-cells:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - EXTERNALURL=yourdomain.url
    - SERVER_IP=0.0.0.0
