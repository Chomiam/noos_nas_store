services:
  qbittorrent:
    container_name: qbittorrent
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    - 6881:6881/tcp
    - 6881:6881/udp
    volumes:
    - ./data/config:/config
    - ./data/downloads:/downloads
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - WEBUI_PORT=8080
    - TORRENTING_PORT=6881
