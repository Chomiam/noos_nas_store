services:
  unifi-network-application:
    container_name: unifi-network-application
    image: linuxserver/unifi-network-application:latest
    restart: unless-stopped
    ports:
    - 8443:8443/tcp
    - 3478:3478/udp
    - 10001:10001/udp
    - 8080:8080/tcp
    - 1900:1900/udp
    - 8843:8843/tcp
    - 8880:8880/tcp
    - 6789:6789/tcp
    - 5514:5514/udp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - MONGO_USER=unifi
    - MONGO_PASS=
    - MONGO_HOST=unifi-db
    - MONGO_PORT=27017
    - MONGO_DBNAME=unifi
    - MONGO_AUTHSOURCE=admin
    - MEM_LIMIT=1024
    - MEM_STARTUP=1024
    - MONGO_TLS=
