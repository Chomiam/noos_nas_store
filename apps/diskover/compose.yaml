services:
  diskover:
    container_name: diskover
    image: linuxserver/diskover:latest
    restart: unless-stopped
    ports:
    - 80:80/tcp
    volumes:
    - ./data/config:/config
    - ./data/data:/data
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - ES_HOST=elasticsearch
    - ES_PORT=9200
