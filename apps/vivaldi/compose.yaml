services:
  vivaldi:
    container_name: vivaldi
    image: linuxserver/vivaldi:latest
    restart: unless-stopped
    ports:
    - 3000:3000/tcp
    - 3001:3001/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - VIVALDI_CLI=https://www.linuxserver.io/
