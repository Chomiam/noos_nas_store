services:
  postgres:
    image: postgres:16-alpine
    container_name: kestra-postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kestra}
      POSTGRES_USER: ${POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k3str4_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:-kestra} -U ${POSTGRES_USER:-kestra}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kestra:
    image: kestra/kestra:latest
    container_name: kestra
    user: root
    command: server standalone
    volumes:
      - ./data/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/tmp:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER:-kestra}
            password: ${POSTGRES_PASSWORD:-k3str4_secret}
        kestra:
          server:
            basicAuth:
              enabled: false
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd
    ports:
      - "${PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
