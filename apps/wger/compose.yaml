services:
  wger-web:
    image: wger/server:latest
    container_name: wger_server
    depends_on:
      wger-db:
        condition: service_healthy
      wger-cache:
        condition: service_healthy
    environment:
    - SECRET_KEY=wger-docker-supersecret-key-1234567890!@#$%^&*(-_)
    - SIGNING_KEY=wger-docker-secret-jwtkey-1234567890!@#$%^&*(-_=+
    - FROM_EMAIL=info@example.com
    - TIME_ZONE=Europe/Athens
    - ALLOW_REGISTRATION=True
    - ALLOW_GUEST_USERS=True
    - ALLOW_UPLOAD_VIDEOS=Tru
    - MIN_ACCOUNT_AGE_TO_TRUST=21
    - SYNC_EXERCISES_ON_STARTUP=False
    - DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP=False
    - DJANGO_DB_ENGINE=django.db.backends.postgresql
    - DJANGO_DB_DATABASE=wger
    - DJANGO_DB_USER=wger
    - DJANGO_DB_PASSWORD=wger
    - DJANGO_DB_HOST=db
    - DJANGO_DB_PORT=5432
    - DJANGO_PERFORM_MIGRATIONS=True
    - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
    - DJANGO_CACHE_LOCATION=redis://cache:6379/1
    - DJANGO_CACHE_TIMEOUT=12
    - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
    - AXES_ENABLED=True
    - AXES_FAILURE_LIMIT=10
    - AXES_COOLOFF_TIME=30
    - AXES_HANDLER=axes.handlers.cache.AxesCacheHandler
    - DJANGO_DEBUG=False
    - WGER_USE_GUNICORN=True
    - EXERCISE_CACHE_TTL=10
    - SITE_URL=http://localhost
    - ACCESS_TOKEN_LIFETIME=10
    - REFRESH_TOKEN_LIFETIME=24
    volumes:
    - ./data/wger/static:/home/wger/static
    - ./data/wger/media:/home/wger/media
    ports:
    - '8000'
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8000
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  wger-nginx:
    image: nginx:stable
    container_name: wger_nginx
    depends_on:
    - wger-web
    volumes:
    - ./data/wger/nginx.conf:/etc/nginx/conf.d/default.conf
    - ./data/wger/static:/wger/static:ro
    - ./data/wger/media:/wger/media:ro
    ports:
    - 680:80
    healthcheck:
      test: service nginx status
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  wger-db:
    image: postgres:12-alpine
    container_name: wger_db
    environment:
    - POSTGRES_USER=wger
    - POSTGRES_PASSWORD=wger
    - POSTGRES_DB=wger
    volumes:
    - ./data/wger/postgres-data:/var/lib/postgresql/data/
    expose:
    - 5432
    healthcheck:
      test: pg_isready -U wger
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  wger-cache:
    image: redis
    container_name: wger_cache
    expose:
    - 6379
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data: null
  static: null
  media: null
networks:
  default:
    name: wger_network
