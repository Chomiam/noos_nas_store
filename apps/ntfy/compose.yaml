services:
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    ports:
    - 8080:80/tcp
    volumes:
    - ./data/var_cache_ntfy:/var/cache/ntfy
    - ./data/etc_ntfy:/etc/ntfy
    environment:
    - PUID=1000
    - PGID=100
    - TZ=UTC
    - UMASK=002
    - NTFY_BASE_URL=http://localhost:8080
