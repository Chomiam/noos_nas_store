services:
  edgeconnector-aggregator:
    image: softingindustrial/edgeconnector-fanuc-cnc
    restart: unless-stopped
    ports:
    - 443
    - 8099
    - 4897
    environment:
    - TZ="UTC"
    volumes:
    - ./data/config_data:/config
    - ./data/mqtt_data:/mqtt
volumes:
  config_data: null
  mqtt_data: null
