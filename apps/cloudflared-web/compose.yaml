services:
  cloudflared-web:
    container_name: cloudflared-web
    image: wisdomsky/cloudflared-web:latest
    restart: unless-stopped
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - WEBUI_PORT=14333
    - BASIC_AUTH_USER=admin
    - BASIC_AUTH_PASS=
