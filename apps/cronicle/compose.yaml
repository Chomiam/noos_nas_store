name: cronicle
services:
  cronicle:
    image: soulteary/cronicle:0.9.80
    restart: unless-stopped
    hostname: cronicle
    environment:
      CRONICLE_WebServer__http_port: '5000'
      CRONICLE_web_direct_connect: 'false'
    ports:
    - 5000:5000
    volumes:
    - ./data/crondata:/opt/cronicle/data
    - ./data/cronlogs:/opt/cronicle/logs
volumes:
  crondata: null
  cronlogs: null
