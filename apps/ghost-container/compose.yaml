services:
  ghost-container:
    container_name: ghost-container
    image: ghost:latest
    restart: unless-stopped
    ports:
    - 2368/tcp
    volumes:
    - ./data/var_lib_ghost_content:/var/lib/ghost/content
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
