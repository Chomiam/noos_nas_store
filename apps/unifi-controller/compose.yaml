services:
  unifi-controller:
    container_name: unifi-controller
    image: linuxserver/unifi-controller:latest
    restart: unless-stopped
    ports:
    - 3478:3478/udp
    - 10001:10001/udp
    - 8080:8080/tcp
    - 8081:8081/tcp
    - 8443:8443/tcp
    - 8843:8843/tcp
    - 8880:8880/tcp
    - 6789:6789/tcp
    volumes:
    - ./data/Unifi:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
