services:
  dokku-container:
    container_name: dokku-container
    image: dokku/dokku:latest
    restart: unless-stopped
    ports:
    - 22/tcp
    - 80/tcp
    - 443/tcp
    volumes:
    - ./data:/mnt/dokku
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - DOKKU_HOSTNAME=
    - DOKKU_HOST_ROOT=/var/lib/dokku/home/dokku
