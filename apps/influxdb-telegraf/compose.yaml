services:
  influxdb:
    image: influxdb:latest
    volumes:
    - ./data/influxdb2:/var/lib/influxdb2:rw
    ports:
    - 8086:8086
    restart: unless-stopped
  influxdb_cli:
    links:
    - influxdb
    image: influxdb:latest
    volumes:
    - ./data/influxdb2:/var/lib/influxdb2:rw
    - ./data/influxdb2/ssl/influxdb-selfsigned.crt:/etc/ssl/influxdb-selfsigned.crt:rw
    - ./data/influxdb2/ssl/influxdb-selfsigned.key:/etc/ssl/influxdb-selfsigned.key:rw
    environment:
    - DOCKER_INFLUXDB_INIT_MODE=setup
    - DOCKER_INFLUXDB_INIT_USERNAME=myusername
    - DOCKER_INFLUXDB_INIT_PASSWORD=passwordpasswordpassword
    - DOCKER_INFLUXDB_INIT_ORG=myorg
    - DOCKER_INFLUXDB_INIT_BUCKET=mybucket
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken
    - INFLUXD_TLS_CERT=/etc/ssl/influxdb-selfsigned.crt
    - INFLUXD_TLS_KEY=/etc/ssl/influxdb-selfsigned.key
    entrypoint:
    - ./entrypoint.sh
    restart: on-failure:10
    depends_on:
    - influxdb
  telegraf:
    image: telegraf
    links:
    - influxdb
    volumes:
    - ./data/telegraf/mytelegraf.conf:/etc/telegraf/telegraf.conf
    env_file:
    - /portainer/Files/AppData/Config/telegraf/influxv2.env
    environment:
    - DOCKER_INFLUXDB_INIT_ORG=myorg
    - DOCKER_INFLUXDB_INIT_BUCKET=mybucket
    - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mytoken
    depends_on:
    - influxdb_cli
    restart: unless-stopped
volumes:
  influxdb2: null
