services:
  meshcentral-mongodb:
    container_name: meshcentral_db
    restart: always
    image: mongo:latest
    expose:
    - 27017
    volumes:
    - ./data/meshcentral/database:/data/db
  meshcentral:
    restart: always
    container_name: meshcentral
    depends_on:
    - meshcentral-mongodb
    image: typhonragewind/meshcentral
    ports:
    - 8086:443
    - 8087:800
    environment:
    - HOSTNAME=my.domain.com
    - REVERSE_PROXY=false
    - REVERSE_PROXY_TLS_PORT=443
    - IFRAME=false
    - ALLOW_NEW_ACCOUNTS=true
    - WEBRTC=false
    - NODE_ENV=production
    volumes:
    - ./data/meshcentral/data:/opt/meshcentral/meshcentral-data
    - ./data/meshcentral/user_files:/opt/meshcentral/meshcentral-files
