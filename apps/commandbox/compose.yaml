services:
  commandbox:
    container_name: commandbox
    image: ortussolutions/commandbox:latest
    restart: unless-stopped
    ports:
    - 8080/tcp
    - 8443/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - CFENGINE=lucee@4.5
