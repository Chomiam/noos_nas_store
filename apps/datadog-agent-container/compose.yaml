services:
  datadog-agent-container:
    container_name: datadog-agent-container
    image: datadog/agent:latest
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./data/cgroup:/host/sys/fs/cgroup
    - ./data/proc:/host/proc
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - DD_API_KEY=
