services:
  flame:
    container_name: flame
    image: pawelmalak/flame:multiarch
    restart: unless-stopped
    ports:
    - 5005:5005/tcp
    volumes:
    - ./data/Flame/data:/app/data
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - PASSWORD=
