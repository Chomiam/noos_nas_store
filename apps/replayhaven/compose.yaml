services:
  replayhaven:
    image: ${REPLAYHAVEN_IMAGE:-ghcr.io/sauerexe/replayhaven:1}
    container_name: replayhaven
    restart: unless-stopped
    ports:
    - ${REPLAYHAVEN_HOST_PORT:-8787}:8787
    env_file:
    - path: .env
      required: false
    environment:
      REPLAYHAVEN_ACCESS_TOKEN: ${REPLAYHAVEN_ACCESS_TOKEN:?Set REPLAYHAVEN_ACCESS_TOKEN
        in .env (copy .env.example)}
      REPLAYHAVEN_PUBLIC_ORIGIN: ${REPLAYHAVEN_PUBLIC_ORIGIN:-http://localhost:8787}
      REPLAYHAVEN_TRUST_PROXY: ${REPLAYHAVEN_TRUST_PROXY:-}
      REPLAYHAVEN_PLAYBACK: ${REPLAYHAVEN_PLAYBACK:-web}
      REPLAYHAVEN_CONTENT_LANGUAGE: ${REPLAYHAVEN_CONTENT_LANGUAGE:-}
      REPLAYHAVEN_SUPPORT_BANNER: ${REPLAYHAVEN_SUPPORT_BANNER:-}
      REPLAYHAVEN_LOG_LEVEL: ${REPLAYHAVEN_LOG_LEVEL:-}
      REPLAYHAVEN_GAME_METADATA: ${REPLAYHAVEN_GAME_METADATA:-}
      REPLAYHAVEN_IGDB_CLIENT_ID: ${REPLAYHAVEN_IGDB_CLIENT_ID:-}
      REPLAYHAVEN_IGDB_CLIENT_SECRET: ${REPLAYHAVEN_IGDB_CLIENT_SECRET:-}
      REPLAYHAVEN_AI_PROVIDER: ${REPLAYHAVEN_AI_PROVIDER:-none}
      REPLAYHAVEN_AI_MODEL: ${REPLAYHAVEN_AI_MODEL:-}
      REPLAYHAVEN_LOCAL_AI_URL: ${REPLAYHAVEN_LOCAL_AI_URL:-}
      REPLAYHAVEN_LOCAL_AI_KEY: ${REPLAYHAVEN_LOCAL_AI_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REPLAYHAVEN_OIDC_ISSUER: ${REPLAYHAVEN_OIDC_ISSUER:-}
      REPLAYHAVEN_OIDC_CLIENT_ID: ${REPLAYHAVEN_OIDC_CLIENT_ID:-}
      REPLAYHAVEN_OIDC_CLIENT_SECRET: ${REPLAYHAVEN_OIDC_CLIENT_SECRET:-}
      REPLAYHAVEN_OIDC_NAME: ${REPLAYHAVEN_OIDC_NAME:-}
      REPLAYHAVEN_OIDC_SCOPES: ${REPLAYHAVEN_OIDC_SCOPES:-}
      REPLAYHAVEN_OIDC_ADMIN_GROUP: ${REPLAYHAVEN_OIDC_ADMIN_GROUP:-}
      REPLAYHAVEN_OIDC_AUTO_CREATE: ${REPLAYHAVEN_OIDC_AUTO_CREATE:-}
      REPLAYHAVEN_PASSWORD_LOGIN: ${REPLAYHAVEN_PASSWORD_LOGIN:-}
    volumes:
    - ./data/archive:/app/vault-data
    - ./data/release:/app/release:ro
volumes:
  archive: null
