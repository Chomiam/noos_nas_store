services:
  wikijs:
    container_name: wikijs
    image: linuxserver/wikijs:latest
    restart: unless-stopped
    ports:
    - 3000:3000/tcp
    volumes:
    - ./data/config:/config
    - ./data/data:/data
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
    - DB_TYPE=sqlite
    - DB_HOST=
    - DB_PORT=
    - DB_NAME=
    - DB_USER=
    - DB_PASS=
