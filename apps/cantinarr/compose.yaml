services:
  cantinarr:
    container_name: cantinarr
    image: ghcr.io/windoze95/cantinarr:latest
    restart: unless-stopped
    ports:
    - 8585:8585/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - CANTINARR_PUSH_GATEWAY_URL=https://push.cantinarr.com
    - CANTINARR_ARR_CALLBACK_URL=
