services:
  mcmyadmin2:
    container_name: mcmyadmin2
    image: linuxserver/mcmyadmin2:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    - 25565:25565/tcp
    volumes:
    - ./data/minecraft:/minecraft
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
