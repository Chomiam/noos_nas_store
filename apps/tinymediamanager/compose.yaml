services:
  tinymediamanager:
    image: tinymediamanager/tinymediamanager:latest
    container_name: tinymediamanager
    environment:
    - USER_ID=1000
    - GROUP_ID=100
    - ALLOW_DIRECT_VNC=true
    - LC_ALL=en_US.UTF-8
    - LANG=en_US.UTF-8
    - PASSWORD=tinymediamanager
    volumes:
    - ./data/tinemediamanager/data:/data
    - ./data/movies:/media/movies
    - ./data/tvshows:/media/tvshows
    ports:
    - 5900:5900
    - 4000:4000
    restart: unless-stopped
