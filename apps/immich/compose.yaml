# =========================================================================
# 🐳 Noos NAS Edition — Configuration Docker Compose
# Application  : Immich (Sauvegarde & Galerie Photos/Vidéos Haute Performance)
# Port hôte    : 2283
# Données hôte : ./data
# Mode         : Production
# =========================================================================

version: "3.8"

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION:-./data/library}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NODE_ENV=production
      - DB_HOSTNAME=immich_postgres
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME:-immich}
      - REDIS_HOSTNAME=immich_redis
      - TZ=${TZ:-Europe/Paris}
    ports:
      - "${PORT:-2283}:2283"
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - ./data/model-cache:/cache
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-Europe/Paris}
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/redis:6.2-alpine@sha256:eaba718fecd1196d8853322149184fa3672ab3d8a11e61c246ab60fe9db50a82
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
    restart: always

  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.1@sha256:9072418b7cc40e94703862a24b7738593e355d5cf516233cae6778f56f620822
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --dbname='${DB_DATABASE_NAME:-immich}' --username='${DB_USERNAME:-postgres}' || exit 1; Chksum=\"$$(psql --dbname='${DB_DATABASE_NAME:-immich}' --username='${DB_USERNAME:-postgres}' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')\"; echo \"checksum failure count is $$Chksum\"; [ \"$$Chksum\" = '0' ] || exit 1" ]
      interval: 5m
      start_interval: 30s
      start_period: 5m
      timeout: 1m
    restart: always

# =========================================================================
# 🎮 Accélération Matérielle GPU (Optionnelle) :
# - Pour Intel QuickSync / AMD (VAAPI) :
#   Sous immich-server, ajouter :
#     devices:
#       - /dev/dri:/dev/dri
# - Pour NVIDIA (NVENC) :
#   Sous immich-server, ajouter :
#     deploy:
#       resources:
#         reservations:
#           devices:
#             - driver: nvidia
#               count: all
#               capabilities: [gpu]
# =========================================================================
