services:
  plesk:
    container_name: plesk
    image: plesk/plesk:latest
    restart: unless-stopped
    ports:
    - 21/tcp
    - 80/tcp
    - 443/tcp
    - 8880/tcp
    - 8443/tcp
    - 8447/tcp
    volumes:
    - ./data/config:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
