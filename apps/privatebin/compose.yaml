services:
  privatebin:
    container_name: privatebin
    image: privatebin/nginx-fpm-alpine:latest
    restart: unless-stopped
    ports:
    - 8080:8080/tcp
    volumes:
    - ./data:/srv/data
    - ./data/PrivateBin:/srv/cfg
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Europe/Paris
    - UMASK=002
