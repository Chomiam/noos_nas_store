services:
  plexrequests:
    container_name: plexrequests
    image: linuxserver/plexrequests:latest
    restart: unless-stopped
    ports:
    - 3000:3000/tcp
    volumes:
    - ./data/PlexRequests:/config
    environment:
    - PUID=1000
    - PGID=100
    - TZ=Europe/Paris
    - UMASK=002
    - URL_BASE=
