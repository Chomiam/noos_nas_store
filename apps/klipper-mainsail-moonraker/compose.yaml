version: '3'
services:
  klipper:
    hostname: klipper
    image: mkuf/klipper:latest
    devices:
    - ${3D_PRINTER_DEVICE}:${3D_PRINTER_DEVICE}
    volumes:
    - ./data/klipper/klipper/printer.cfg:/opt/printer_data/config/printer.cfg
    - ./data/klipper/klipper/logs:/opt/printer_data/logs
    - ./data/klipper/run:/opt/printer_data/run
    - ./data/klipper/gcode:/opt/printer_data/gcodes
    restart: unless-stopped
    networks:
    - klipper
  moonraker:
    hostname: moonraker
    image: mkuf/moonraker:latest
    ports:
    - 7125:7125
    volumes:
    - ./data/klipper/moonraker/moonraker.conf:/opt/printer_data/config/moonraker.conf
    - ./data/klipper/moonraker/logs:/opt/printer_data/logs
    - ./data/klipper/run:/opt/printer_data/run
    - ./data/klipper/gcode:/opt/printer_data/gcodes
    restart: unless-stopped
    networks:
    - klipper
  mainsail:
    hostname: mainsail
    image: ghcr.io/mainsail-crew/mainsail:edge
    ports:
    - 4070:80
    volumes:
    - ./data/klipper/mainsail/config.json:/usr/share/nginx/html/config.json
    restart: unless-stopped
    networks:
    - klipper
networks:
  klipper: null
