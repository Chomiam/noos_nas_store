version: '3'
services:
  klipper:
    hostname: klipper
    image: mkuf/klipper:latest
    devices:
      - ${PRINTER_DEVICE:-/dev/null}:${PRINTER_DEVICE:-/dev/null}
    volumes:
      - ./data/config:/opt/printer_data/config
      - ./data/logs:/opt/printer_data/logs
      - ./data/run:/opt/printer_data/run
      - ./data/gcode:/opt/printer_data/gcodes
    restart: unless-stopped
    networks:
      - klipper
  moonraker:
    hostname: moonraker
    image: mkuf/moonraker:latest
    ports:
      - "${PORT:-7125}:7125"
    volumes:
      - ./data/config:/opt/printer_data/config
      - ./data/logs:/opt/printer_data/logs
      - ./data/run:/opt/printer_data/run
      - ./data/gcode:/opt/printer_data/gcodes
      - ./data/database:/opt/printer_data/database
    restart: unless-stopped
    networks:
      - klipper
  mainsail:
    hostname: mainsail
    image: ghcr.io/mainsail-crew/mainsail:edge
    ports:
      - "${MAINSAIL_PORT:-4070}:80"
    volumes:
      - ./data/mainsail:/usr/share/nginx/html/config
    restart: unless-stopped
    networks:
      - klipper
networks:
  klipper:
