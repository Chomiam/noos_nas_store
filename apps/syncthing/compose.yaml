services:
  syncthing:
    container_name: syncthing
    image: linuxserver/syncthing:latest
    restart: unless-stopped
    ports:
    - 8384:8384/tcp
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    volumes:
    - ./data/config:/config
    - ./data/data1:/data1
    - ./data/data2:/data2
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - UMASK=002
